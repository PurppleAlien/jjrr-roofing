<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJRR — QR Code</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      padding: 20px;
    }
    .qr-wrap {
      text-align: center;
    }
    .qr-wrap img {
      width: min(80vw, 500px);
      height: min(80vw, 500px);
      border-radius: 16px;
      border: 3px solid #c9a84c;
      display: block;
    }
    .qr-wrap p {
      color: #888;
      font-size: 14px;
      margin-top: 16px;
      letter-spacing: 1px;
    }
    .qr-wrap .url {
      color: #c9a84c;
      font-size: 13px;
      margin-top: 4px;
      word-break: break-all;
    }
    .qr-wrap .note {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="qr-wrap">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://leafy-sprite-4343c8.netlify.app/" alt="JJRR QR Code">
    <p>JJRR — Roofing &amp; Home Services</p>
    <p class="url">leafy-sprite-4343c8.netlify.app</p>
    <p class="note">Right-click → Save Image As para descargar</p>
  </div>
</body>
</html>
